# Headers for the single-page app. The API behind /api/ sets its own.
#
# The CSP allows only this origin. The built app has no inline script or
# style, fetches the API same-origin, and loads nothing from a CDN, so none of
# 'unsafe-inline', 'unsafe-eval', or third-party hosts is needed.
# img-src excludes remote hosts on purpose: an answer's Markdown image
# pointing at an attacker's server would otherwise leak that a user read it,
# a classic exfiltration channel for prompt injection.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts_header always;
