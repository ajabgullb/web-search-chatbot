# Proxy settings shared by every location that forwards to the API.
# Included from default.conf.template; $api_upstream is set there.

proxy_pass $api_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Replaced, never appended to: $remote_addr is the client as resolved by the
# real_ip rules (25-real-ip.sh), and the API rate-limits on this one value.
# Appending would forward whatever the client sent, and the API would key its
# limits on an address the client chose.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# Run streams are server-sent events: every event must reach the browser as
# it is written, not when a buffer fills.
proxy_buffering off;
proxy_cache off;
# Longer than the heartbeat (15 s) so a quiet stream is never cut.
proxy_read_timeout 120s;
# The API sets its own security headers; none are added here.
