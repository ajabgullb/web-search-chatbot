name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to major versions from their official publishers;
# Dependabot (.github/dependabot.yml) proposes updates weekly.

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Providers are never called in CI; fakes are used from Phase 5 onward.
  ENVIRONMENT: test

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --frozen fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app evals

      - name: Run migrations on an empty database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Unit, integration, and contract tests (tests/contract pins the
      # committed OpenAPI schema), plus the deterministic eval subset.
      - name: Test
        run: uv run pytest

      # The same gate `make test` enforces, run on its own for the report.
      - name: Agent evals (deterministic subset)
        run: uv run python -m evals.run --subset ci --no-report

      - name: Check the committed OpenAPI schema is current
        run: |
          uv run python -m scripts.export_openapi ../openapi.json
          git diff --exit-code ../openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails if package-lock.json has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The committed client must match the committed schema. Regenerating and
      # diffing catches a backend schema change that never reached the client.
      - name: Check the generated API client is current
        run: |
          npm run generate-client
          git diff --exit-code src/api/generated

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      # The e2e server creates, migrates, and empties this database itself.
      E2E_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright starts the API (scripted providers) and Vite itself.
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Exact, hashed runtime dependencies from the lockfile, checked against
      # the PyPI advisory database.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit --disable-pip -r requirements.txt

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
