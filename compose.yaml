# Local development stack. `compose.prod.yaml` (Phase 8) covers deployment.
name: web-search-chatbot

services:
  postgres:
    # PostgreSQL 16 with pgvector (ADR-0015). Debian-based, unlike the old
    # postgres:16-alpine: a data volume from that image must be dumped and
    # restored, not reattached, because the two sort text differently.
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Exposed so host tools (alembic, pytest) reach the same database.
      # Host ports are overridable because developers often run several stacks.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Run locks now; rate limits and cancellation signals later in Phase 8.
    # Nothing here needs to survive a restart (locks are leases that expire,
    # and the database still guards correctness), so persistence is off.
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every outbound email in development; UI on http://localhost:8025.
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_HOST_PORT:-1025}:1025'
      - '${MAILPIT_UI_HOST_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
    environment:
      # Overrides the host-facing value in .env: inside the network the
      # database is reachable as `postgres`, not `localhost`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      # Mail goes to Mailpit unless DEV_SMTP_HOST names a real relay. These
      # win over SMTP_HOST/SMTP_PORT in .env, which describe the host-side view.
      SMTP_HOST: ${DEV_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      REDIS_URL: redis://redis:6379/0
    # Single dev replica, so migrating here is safe. Production runs migrations
    # as an explicit release job instead (AGENTS.md §14).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - '${API_HOST_PORT:-8000}:8000'
    volumes:
      # Bind-mount source for hot reload, but keep the image's virtualenv.
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      # Vite proxies /api to the API container so the browser sees one origin.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - '${WEB_HOST_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  # --- Observability (ADR-0016): `make dev-observability` -------------------
  # Profiled, so `make dev` starts none of these. Ports bind to 127.0.0.1:
  # Grafana lets anonymous viewers in, and that must stay on this machine.

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - api

  grafana-db-reader:
    # One-shot: creates or refreshes Grafana's read-only database login. It
    # waits for the API's migrations, because the grants name their columns.
    profiles: [observability]
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-app}
      PGDATABASE: ${POSTGRES_DB:-app}
      READER_PASSWORD: ${GRAFANA_DB_READER_PASSWORD:-grafana_reader}
    volumes:
      - ./observability/postgres/grafana_reader.sql:/grafana_reader.sql:ro
    # The password goes in over stdin: psql expands :'var' there, not in -c.
    command: >
      sh -c "until psql -qtAc 'SELECT 1 FROM embedding_usage LIMIT 0' >/dev/null 2>&1;
             do echo 'waiting for migrations'; sleep 2; done &&
             psql -v ON_ERROR_STOP=1 -q -f /grafana_reader.sql &&
             echo \"ALTER ROLE grafana_reader WITH LOGIN PASSWORD :'pw'\" |
             psql -v ON_ERROR_STOP=1 -q -v pw=\"$$READER_PASSWORD\""
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Open the dashboard without logging in; sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/web-search-chatbot.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # Read by the datasource provisioning file.
      POSTGRES_DB: ${POSTGRES_DB:-app}
      GRAFANA_DB_READER_PASSWORD: ${GRAFANA_DB_READER_PASSWORD:-grafana_reader}
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      prometheus:
        condition: service_started
      grafana-db-reader:
        condition: service_completed_successfully

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
