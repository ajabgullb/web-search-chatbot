[project]
name = "web-search-chatbot-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the web-search chatbot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "aiosmtplib>=5.1.2",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "langsmith>=0.12.4",
    "pgvector>=0.5.1",
    "openai>=3.13.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "asgi-lifespan>=2.1.0",
    "fakeredis[lua]>=2.38.0",
    "httpx2>=2.12.0",
]

# This is an application, not a distributable library: uv manages the
# environment without building/installing the project itself.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# Fixture passwords and signing keys in tests are deliberately fake. The
# hardcoded-credential rules stay active for everything under app/.
# Polling in tests (ASYNC110) watches state in the database or in a fake
# provider, which no asyncio.Event can observe.
"tests/*" = ["S105", "S106", "S107", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL database",
]
