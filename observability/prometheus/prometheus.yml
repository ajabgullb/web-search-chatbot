# Scrapes the API's /metrics every 15 s and keeps the history (ADR-0016).
# Development only: the endpoint is open there. A production scrape must
# present METRICS_TOKEN as a bearer token; see docs/observability.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      # The Compose service name; one dev replica. Several replicas would each
      # need to be listed (or discovered), because each counts only its own work.
      - targets: ['api:8000']

  # MCP usage, counted from Claude Code's telemetry by the collector
  # (ADR-0018): 8889 is the MCP metrics, 8888 the collector's own counters.
  - job_name: mcp
    static_configs:
      - targets: ['otel-collector:8889', 'otel-collector:8888']
