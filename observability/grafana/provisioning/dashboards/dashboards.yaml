# The committed JSON files are the dashboards' source of truth. Grafana will
# not save UI edits over them: change a panel in the UI, then Export -> JSON
# and overwrite the file in observability/grafana/dashboards/
# (web-search-chatbot.json, or mcp-usage.json for the MCP usage dashboard).
apiVersion: 1

providers:
  - name: web-search-chatbot
    type: file
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
